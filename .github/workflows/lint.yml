# Lints the QuPath script (LabConstrictorTools.groovy) with npm-groovy-lint (CodeNarc rules); the rules are set in .groovylintrc.json.
#
# What this does NOT run: the GUI tests in tests/. They drive a real QuPath window (QuPath 0.7 on Java 25, a virtual display, registered
# LabConstrictor apps), so they cannot run on a GitHub runner; run them by hand with tests/run_gui_test.sh (see README, "Build and test").
name: lint

on:
  push:
    branches: [main]
  pull_request:

jobs:
  groovy-lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4        # npm-groovy-lint runs CodeNarc on the JVM
        with:
          distribution: temurin
          java-version: "21"
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
      - name: Lint the script (fails on any finding)
        run: >
          npx --yes npm-groovy-lint@18.0.0
          --path src/main/resources/org/cellmigrationlab/labconstrictor/qupath
          --files "**/*.groovy"
          --failon info
